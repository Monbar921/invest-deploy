# /api, /oauth2, /login, /logout сюда не доходят: их забирает ingress и отправляет в invest-gateway
server {
    listen 8080;
    root /usr/share/nginx/html;

    # SPA: любые пути отдаёт index.html, маршрутизирует React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем, чтобы после деплоя браузер сразу подхватил новые ассеты
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # у ассетов Vite хэш в имени
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
